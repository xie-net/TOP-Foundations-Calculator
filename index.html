<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <title>Xie's Calculator</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>

    <body>
        <h1>CALCULATOR</h1>
        <div id="calculator">
            <div id="display">0</div>

            <div id="buttons">
                <div class="button-row">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button class="operator">÷</button>
                </div>

                <div class="button-row">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button class="operator">×</button>
                </div>

                <div class="button-row">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button class="operator">−</button>
                </div>

                <div class="button-row">
                    <button class="clear">C</button>
                    <button>0</button>
                    <button class="equals">=</button>
                    <button class="operator">+</button>
                </div>
            </div>
        </div>
    </body>
</html>
